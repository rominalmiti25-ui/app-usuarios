<style>
  .herramientas{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .herramientas:empty{display:none}
  .herramientas button{width:auto;margin:0;padding:9px 14px;font-size:.85rem}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;-webkit-overflow-scrolling:touch}
  .chips .chip{flex:0 0 auto;width:auto;margin:0;padding:8px 14px;border-radius:99px;background:#fff;color:#2563eb;
               border:1.5px solid #2563eb;font-size:.85rem;font-weight:600}
  .chips .chip.activa{background:#2563eb;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
  .prod{border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;display:flex;flex-direction:column}
  .prod:focus-visible{outline:2px solid #2563eb}
  .prod img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#e2e8f0;display:block}
  .prod h3{margin:10px 10px 4px;font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden}
  .prod .precio{margin:0 10px 12px;font-weight:700;color:#2563eb}
  .spinner{width:42px;height:42px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;
           margin:36px auto;animation:giro .8s linear infinite}
  @keyframes giro{to{transform:rotate(360deg)}}
  .vacio{text-align:center;color:#64748b;padding:24px 8px}
  #cat-detalle .volver{width:auto;margin:12px 0 10px;padding:8px 14px;font-size:.9rem}
  #cat-detalle .det-img{width:100%;max-height:340px;object-fit:cover;border-radius:14px;background:#e2e8f0;display:block}
  #cat-detalle .det-titulo{font-size:1.3rem;margin:14px 0 4px}
  #cat-detalle .det-precio{margin:0 0 10px;font-size:1.25rem;font-weight:700;color:#2563eb}
  #cat-detalle .det-desc{line-height:1.5;color:#334155}
  #cat-detalle textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:1rem;
                        font-family:inherit;min-height:110px;resize:vertical}
  #cat-detalle .previa{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:10px;background:#e2e8f0}
  #cat-detalle .nota{font-size:.8rem;color:#64748b;margin:6px 0 0}
  #cat-detalle .acciones{display:flex;gap:10px}
  #cat-detalle .acciones button{margin-top:16px}
  .peligro{background:#dc2626!important;color:#fff!important}
</style>

<div id="cat-app">
  <div id="cat-cabecera">
    <div id="cat-herramientas" class="herramientas"></div>
    <div id="cat-chips" class="chips" aria-label="Categorías"></div>
  </div>
  <div id="cat-estado"></div>
  <div id="cat-grid" class="grid"></div>
  <div id="cat-detalle" hidden></div>
</div>

<script>
(() => {
  // El perfil se lee de la sesión del servidor (JWT), nunca de datos que mande el cliente
  const ROL = {{ sesion.rol|tojson }};
  const ES_ADMIN = ROL === 'Administrador';

  const $ = id => document.getElementById(id);
  const cabecera = $('cat-cabecera'), herramientas = $('cat-herramientas'), chips = $('cat-chips'),
        estado = $('cat-estado'), grid = $('cat-grid'), detalle = $('cat-detalle');
  const JSON_H = {'Content-Type': 'application/json'};
  let categorias = [], categoriaActiva = null, productos = [], peticion = 0, cambiado = false;

  const dinero = n => new Intl.NumberFormat('es-MX', {style: 'currency', currency: 'MXN'}).format(n);

  // Crea elementos con textContent (los datos del catálogo nunca se insertan como HTML)
  const el = (tag, attrs = {}, ...hijos) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    hijos.forEach(h => h && n.append(h));
    return n;
  };

  async function pedir(url, opciones) {
    let r;
    try { r = await fetch(url, opciones); }
    catch { throw new Error('No se pudo conectar con el servidor. Revisa tu conexión.'); }
    if (r.status === 401) { location.replace('/login'); throw new Error('sesion'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(d.error || 'Error inesperado'); e.status = r.status; throw e; }
    return d;
  }

  // Reduce la foto en el navegador (máx. 1000 px, JPEG) antes de subirla: más rápido y nunca supera el límite
  function reducirImagen(archivo, lado = 1000, calidad = 0.85) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(archivo);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const escala = Math.min(1, lado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? resolve(b) : reject(new Error('No se pudo procesar la imagen.')), 'image/jpeg', calidad);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('El archivo no es una imagen válida.')); };
      img.src = url;
    });
  }

  // ── Estado de carga y de error (US03-E2, US03-E3) ──
  const mostrarCarga = () => estado.replaceChildren(el('div', {class: 'spinner', role: 'status', 'aria-label': 'Cargando'}));
  const recargarTodo = () => { cargarCategorias(); cargarProductos(); };
  function mostrarError(mensaje) {
    estado.replaceChildren(
      el('div', {class: 'alerta error', role: 'alert', text: mensaje}),
      el('button', {type: 'button', text: 'Reintentar', onclick: recargarTodo})
    );
  }

  // ── Categorías (US04-E1) ──
  async function cargarCategorias() {
    try { categorias = await pedir('/products/categories'); } catch { /* el catálogo igual se intenta cargar */ }
    if (categoriaActiva && !categorias.includes(categoriaActiva)) categoriaActiva = null;
    pintarChips();
  }
  function pintarChips() {
    const chip = (texto, valor) => el('button', {
      type: 'button', class: 'chip' + (categoriaActiva === valor ? ' activa' : ''), text: texto,
      onclick: () => seleccionar(valor)
    });
    chips.replaceChildren(chip('Ver todos', null), ...categorias.map(c => chip(c, c)));
    pintarHerramientas();
  }
  // Los botones de administración se crean solo si el rol es Administrador: para los demás no existen en la página
  function pintarHerramientas() {
    if (!ES_ADMIN) return;
    const botones = [
      el('button', {type: 'button', text: '＋ Producto', onclick: () => formularioProducto(null)}),
      el('button', {type: 'button', class: 'sec', text: '＋ Categoría', onclick: formularioCategoria})
    ];
    if (categoriaActiva) botones.push(el('button', {type: 'button', class: 'peligro',
      text: 'Eliminar categoría «' + categoriaActiva + '»', onclick: eliminarCategoria}));
    herramientas.replaceChildren(...botones);
  }
  function seleccionar(valor) {
    if (valor === categoriaActiva) return;
    categoriaActiva = valor;      // null = "Ver todos": vuelve a consumir /products (US04-E3)
    pintarChips();
    cargarProductos();            // US04-E2
  }

  // ── Catálogo (US03-E1) ──
  async function cargarProductos() {
    const mia = ++peticion;
    productos = []; grid.replaceChildren();   // limpia los datos anteriores antes de la nueva petición
    mostrarCarga();
    try {
      const url = categoriaActiva ? '/products?categoria=' + encodeURIComponent(categoriaActiva) : '/products';
      const datos = await pedir(url);
      if (mia !== peticion) return;           // llegó una respuesta vieja: se ignora
      productos = datos; estado.replaceChildren(); pintarGrid();
    } catch (e) {
      if (mia !== peticion || e.message === 'sesion') return;
      mostrarError(e.message);
    }
  }
  function pintarGrid() {
    if (!productos.length) { grid.replaceChildren(el('p', {class: 'vacio', text: 'No hay productos en esta categoría.'})); return; }
    grid.replaceChildren(...productos.map(p => el('article',
      {class: 'prod', tabindex: '0', role: 'button', 'aria-label': p.titulo,
       onclick: () => abrirDetalle(p.id),
       onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrirDetalle(p.id); } }},
      el('img', {src: p.imagen, alt: p.titulo, loading: 'lazy', decoding: 'async'}),   // descarga asíncrona
      el('h3', {text: p.titulo}),
      el('p', {class: 'precio', text: dinero(p.precio)})
    )));
  }

  // ── Detalle (US05) ──
  function mostrarVista(esDetalle) {
    cabecera.hidden = grid.hidden = estado.hidden = esDetalle;
    detalle.hidden = !esDetalle;
  }
  async function abrirDetalle(id) {
    mostrarVista(true);
    detalle.replaceChildren(el('div', {class: 'spinner', role: 'status', 'aria-label': 'Cargando'}));
    try {
      pintarDetalle(await pedir('/products/' + id));
    } catch (e) {
      if (e.message === 'sesion') return;
      alert('Producto no disponible');          // US05-E3
      volverCatalogo(true);
    }
  }
  function pintarDetalle(p) {
    const partes = [
      el('button', {type: 'button', class: 'sec volver', text: '← Volver al catálogo', onclick: () => volverCatalogo(cambiado)}),
      el('img', {class: 'det-img', src: p.imagen, alt: p.titulo, decoding: 'async'}),
      el('h2', {class: 'det-titulo', text: p.titulo}),
      el('p', {class: 'det-precio', text: dinero(p.precio)}),
      el('span', {class: 'rol', text: p.categoria}),
      el('p', {class: 'det-desc', text: p.descripcion})
    ];
    // Editar/Eliminar solo se crean si el rol es Administrador: no existen ocultos para los demás (US05-E1/E2)
    if (ES_ADMIN) partes.push(el('div', {class: 'acciones'},
      el('button', {type: 'button', text: 'Editar', onclick: () => formularioProducto(p)}),
      el('button', {type: 'button', class: 'peligro', text: 'Eliminar', onclick: () => eliminar(p)})
    ));
    detalle.replaceChildren(...partes);
  }
  async function volverCatalogo(recargar) {
    detalle.replaceChildren(); mostrarVista(false);
    if (recargar) { cambiado = false; await cargarCategorias(); cargarProductos(); }
  }

  async function eliminar(p) {
    if (!confirm('¿Eliminar «' + p.titulo + '»? Esta acción no se puede deshacer.')) return;
    try { await pedir('/products/' + p.id, {method: 'DELETE'}); volverCatalogo(true); }
    catch (e) { if (e.message !== 'sesion') alert(e.message); }
  }

  // ── Administración: categorías ──
  function formularioCategoria() {
    mostrarVista(true);
    const alerta = el('div', {class: 'alerta', role: 'alert'});
    const nombre = el('input', {id: 'fc-nombre', required: '', maxlength: '50', autocomplete: 'off'});
    const guardar = el('button', {type: 'submit', text: 'Crear categoría'});
    const form = el('form', {},
      el('label', {for: 'fc-nombre', text: 'Nombre de la categoría'}), nombre, alerta, guardar,
      el('button', {type: 'button', class: 'sec', text: 'Cancelar', onclick: () => volverCatalogo(false)})
    );
    form.addEventListener('submit', async e => {
      e.preventDefault(); alerta.className = 'alerta'; guardar.disabled = true;
      try {
        await pedir('/products/categories', {method: 'POST', headers: JSON_H, body: JSON.stringify({nombre: nombre.value})});
        volverCatalogo(true);
      } catch (err) {
        if (err.message === 'sesion') return;
        alerta.textContent = err.message; alerta.className = 'alerta error'; guardar.disabled = false;
      }
    });
    detalle.replaceChildren(el('h2', {class: 'det-titulo', text: 'Nueva categoría'}), form);
  }
  async function eliminarCategoria() {
    if (!categoriaActiva || !confirm('¿Eliminar la categoría «' + categoriaActiva + '»?')) return;
    try {
      await pedir('/products/categories?nombre=' + encodeURIComponent(categoriaActiva), {method: 'DELETE'});
      categoriaActiva = null; recargarTodo();
    } catch (e) { if (e.message !== 'sesion') alert(e.message); }   // p. ej. «tiene productos»
  }

  // ── Administración: crear y editar productos (con imagen) ──
  function formularioProducto(p) {
    mostrarVista(true);
    const nuevo = !p;
    const alerta = el('div', {class: 'alerta', role: 'alert'});
    const titulo = el('input', {id: 'fp-titulo', required: '', maxlength: '150', value: p ? p.titulo : ''});
    const precio = el('input', {id: 'fp-precio', type: 'number', step: '0.01', min: '0.01', required: '', value: p ? String(p.precio) : ''});
    const descripcion = el('textarea', {id: 'fp-desc', required: '', maxlength: '2000', text: p ? p.descripcion : ''});
    const categoria = el('select', {id: 'fp-cat', required: ''}, ...categorias.map(c => {
      const o = el('option', {value: c, text: c});
      if (c === (p ? p.categoria : categoriaActiva)) o.selected = true;
      return o;
    }));
    const archivo = el('input', {id: 'fp-img', type: 'file', accept: 'image/*'});
    const previa = el('img', {class: 'previa', alt: 'Vista previa de la imagen', hidden: ''});
    if (p) { previa.src = p.imagen; previa.hidden = false; }
    archivo.addEventListener('change', () => {
      const f = archivo.files[0];
      if (f) { previa.src = URL.createObjectURL(f); previa.hidden = false; }
    });
    const guardar = el('button', {type: 'submit', text: nuevo ? 'Crear producto' : 'Guardar cambios'});
    if (!categorias.length) { guardar.disabled = true; alerta.textContent = 'Primero crea una categoría.'; alerta.className = 'alerta error'; }

    const form = el('form', {},
      el('label', {for: 'fp-titulo', text: 'Título'}), titulo,
      el('label', {for: 'fp-precio', text: 'Precio'}), precio,
      el('label', {for: 'fp-desc', text: 'Descripción'}), descripcion,
      el('label', {for: 'fp-cat', text: 'Categoría'}), categoria,
      el('label', {for: 'fp-img', text: nuevo ? 'Imagen del producto' : 'Cambiar imagen (opcional)'}), archivo,
      el('p', {class: 'nota', text: 'JPG, PNG o WEBP. Se reduce automáticamente antes de subirla.'}), previa,
      alerta, guardar,
      el('button', {type: 'button', class: 'sec', text: 'Cancelar', onclick: () => nuevo ? volverCatalogo(false) : pintarDetalle(p)})
    );
    form.addEventListener('submit', async e => {
      e.preventDefault(); alerta.className = 'alerta'; guardar.disabled = true;
      let guardado;
      try {
        guardado = await pedir(nuevo ? '/products' : '/products/' + p.id, {
          method: nuevo ? 'POST' : 'PUT', headers: JSON_H,
          body: JSON.stringify({titulo: titulo.value, precio: Number(precio.value),
                                descripcion: descripcion.value, categoria: categoria.value})
        });
      } catch (err) {
        if (err.message === 'sesion') return;
        alerta.textContent = err.message; alerta.className = 'alerta error'; guardar.disabled = false; return;
      }
      cambiado = true;
      const f = archivo.files[0];
      if (f) {
        try {
          guardado = await pedir('/products/' + guardado.id + '/image',
            {method: 'PUT', headers: {'Content-Type': 'image/jpeg'}, body: await reducirImagen(f)});
        } catch (err) {
          if (err.message === 'sesion') return;
          alert('El producto se guardó, pero la imagen no se pudo subir: ' + err.message +
                '\nPuedes editar el producto para intentarlo de nuevo.');
        }
      }
      if (nuevo) volverCatalogo(true); else pintarDetalle(guardado);
    });
    detalle.replaceChildren(el('h2', {class: 'det-titulo', text: nuevo ? 'Nuevo producto' : 'Editar producto'}), form);
  }

  cargarCategorias();
  cargarProductos();
})();
</script>
