{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<h1>Iniciar sesión</h1><p class="sub">Accede con tu usuario</p>
<form id="form" autocomplete="on">
  <label for="usuario">Usuario</label><input id="usuario" name="usuario" required autocomplete="username">
  <label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password">
  <div id="alerta" class="alerta" role="alert"></div>
  <button id="btn" type="submit">Iniciar Sesión</button>
</form>
<p class="centro">¿No tienes cuenta? Solicítala a un administrador.</p>
{% endblock %}
{% block scripts %}
<script>
  // US02-E2: en el Login, el botón "Atrás" no puede regresar a vistas protegidas
  history.pushState(null, '', location.href);
  addEventListener('popstate', () => history.pushState(null, '', location.href));

  const alerta = document.getElementById('alerta'), btn = document.getElementById('btn');
  const mostrar = m => { alerta.textContent = m; alerta.className = 'alerta error'; };

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    alerta.className = 'alerta';
    if (!navigator.onLine) { mostrar('Sin conexión a internet. Revisa tu red e inténtalo de nuevo.'); return; } // US01-E3
    btn.disabled = true;
    try {
      const r = await fetch('/auth/login', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({usuario: usuario.value, password: password.value})});
      const d = await r.json().catch(() => ({}));
      if (r.ok) location.replace('/home');
      else mostrar(r.status === 401 ? 'Usuario o contraseña inválidos' : (d.error || 'Error inesperado'));
    } catch { mostrar('No se pudo conectar con el servidor.'); }
    btn.disabled = false;
  });
</script>
{% endblock %}
